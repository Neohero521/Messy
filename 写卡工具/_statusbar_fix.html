<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
/* === Step 2: 配色方案 === */
:root {
  --m-bg: #fdfbf7;
  --m-card: #ffffff;
  --m-line: #e8e4da;
  --m-text: #4a5568;
  --m-label: #94a3b8;
  --m-accent: #7fa8c9;
  --m-accent-pink: #e9b5c3;
  --m-shadow: 0 4px 15px rgba(203, 213, 225, 0.18);
  --m-num: #5a8fb8;
  --m-ok: #8ba888;
  --m-warn: #cf9f5e;
  --m-risk: #c98b7a;
  --m-grid-bg: #fcfdfd;
}

/* === Step 4: CSS样式 === */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--m-bg);
  color: var(--m-text);
  padding: 10px;
  line-height: 1.4;
}

.mvu-matrix-ui {
  max-width: 780px;
  margin: 0 auto;
}

.matrix-card {
  background: var(--m-card);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: var(--m-shadow);
  border: 1px solid var(--m-line);
}

.matrix-title {
  font-size: 0.78em;
  font-weight: 700;
  color: var(--m-accent);
  text-align: center;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--m-line);
  letter-spacing: 0.03em;
}

.summary-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-top: 6px;
}

.m-bar-wrap {
  height: 5px;
  background: #edf2f7;
  border-radius: 10px;
  overflow: hidden;
  margin: 8px 0;
}
.m-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--m-accent-pink), var(--m-accent));
  transition: width 0.6s ease;
}
.m-bar-fill.logic {
  background: linear-gradient(90deg, var(--m-accent), var(--m-ok));
}

/* 5x5 矩阵核心：强制等分 */
.matrix-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}

.matrix-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1 / 1;
  background: var(--m-grid-bg);
  border-radius: 6px;
  border: 1px solid var(--m-line);
  padding: 3px 2px;
  min-width: 0;
  transition: all 0.2s ease;
}
.matrix-item:hover {
  border-color: var(--m-accent);
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(127, 168, 201, 0.15);
}

.m-label {
  font-size: 0.58em;
  color: var(--m-label);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
  text-align: center;
  font-weight: 500;
}

.m-value {
  font-size: 0.64em;
  font-weight: 600;
  color: var(--m-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
  text-align: center;
  margin-top: 2px;
  line-height: 1.2;
}

.m-value.num { color: var(--m-num); }
.m-value.ok  { color: var(--m-ok); }
.m-value.warn{ color: var(--m-warn); }
.m-value.risk{ color: var(--m-risk); }
.m-value.good{ color: #a386b8; }

.loading-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 20px;
  color: var(--m-label);
  font-size: 0.7em;
  animation: breathe 2s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.flash-update { animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn {
  from { opacity: 0.6; }
  to { opacity: 1; }
}

@media(max-width: 520px) {
  .matrix-title { font-size: 0.72em; }
  .m-label { font-size: 0.52em; }
  .m-value { font-size: 0.58em; }
  .matrix-card { padding: 9px; }
}
  </style>
  <script defer>
(function() {
  var ready = function(fn) {
    if (document.readyState === "complete" || document.readyState === "interactive") setTimeout(fn, 0);
    else if (document.addEventListener) document.addEventListener("DOMContentLoaded", fn);
  };
  var ec = function(fn) { return function() { try { var r = fn.apply(this, arguments); if (r && r.catch) r.catch(function(e) { console.warn("[statusbar] async:", e); }); return r; } catch(e) { console.warn("[statusbar] sync:", e); } } };
  if (typeof waitGlobalInitialized === "undefined") { window.waitGlobalInitialized = function(n) { return new Promise(function(r) { if (window[n]) { r(); return; } var c = setInterval(function() { if (window[n]) { clearInterval(c); r(); } }, 100); setTimeout(function() { clearInterval(c); r(); }, 3000); }); }; }
  if (typeof errorCatched === "undefined") { window.errorCatched = function(fn) { return function() { try { return fn.apply(this, arguments); } catch(e) { console.warn("[statusbar]", e); } }; }; }
  if (typeof eventOn === "undefined") { window.eventOn = function() {}; }
  if (typeof Mvu === "undefined") { window.Mvu = { events: { VARIABLE_INITIALIZED: "VARIABLE_INITIALIZED", VARIABLE_UPDATE_ENDED: "VARIABLE_UPDATE_ENDED" } }; }
  if (typeof _ === "undefined") {
    window._ = { get: function(o, p, d) {
      if (o == null) return d;
      var k = String(p).split("."); var c = o;
      for (var i = 0; i < k.length; i++) { if (c == null) return d; c = c[k[i]]; }
      return c === undefined ? d : c;
    }, clamp: function(v, mn, mx) { v = Number(v) || 0; return Math.max(mn, Math.min(mx, v)); } };
  }

/* === Step 5: 变量读取 === */
function loadVars() {
  var allVars = (typeof getAllVariables === "function") ? getAllVariables() : {};
  var sd = _.get(allVars, "stat_data", {});
  return {
    targetName: String(_.get(sd, "目标.名", _.get(sd, "受测者.名", "待观测受测者")) || "待观测受测者"),
    pleasure: Number(_.get(sd, "目标.状态.快感", 0)) || 0,
    logic: Number(_.get(sd, "目标.状态.逻辑稳定性", _.get(sd, "受测者.逻辑稳定性", 100))) || 0,
    obey: Number(_.get(sd, "目标.状态.服从", 10)) || 0,
    body: _.get(sd, "目标.身体", {}) || {},
    outfit: _.get(sd, "目标.着装", {}) || {}
  };
}

/* === Step 6: 渲染函数 === */
function classifyValue(val, label) {
  if (typeof val === "number") return "num";
  var s = String(val);
  if (/锁定|受限|待观测|未扫描/i.test(s)) return "warn";
  if (/正常|平稳|完整|松弛|待机|干燥|低/i.test(s)) return "ok";
  if (/破损|撕裂|崩解|融化|高|极高|过载|流失|侵蚀/i.test(s)) return "risk";
  if (/发热|湿润|红润|敏感|快感|升温|充血/i.test(s)) return "good";
  return "";
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderMatrix($container, obj, preferredOrder) {
  var entries = [];
  if (preferredOrder && preferredOrder.length) {
    for (var i = 0; i < preferredOrder.length; i++) {
      var k = preferredOrder[i];
      if (obj.hasOwnProperty(k) || Object.keys(obj).indexOf(k) >= 0) entries.push([k, obj[k]]);
    }
  }
  var seen = {};
  for (var j = 0; j < entries.length; j++) seen[entries[j][0]] = true;
  var rest = Object.keys(obj || {});
  for (var r = 0; r < rest.length; r++) {
    var rk = rest[r];
    if ((rk.indexOf("_") === 0) || (rk.indexOf("$") === 0)) continue;
    if (seen[rk]) continue;
    entries.push([rk, obj[rk]]);
  }
  var html = "";
  if (entries.length === 0) {
    html = '<div class="loading-state">系统扫描中...</div>';
  } else {
    for (var i2 = 0; i2 < 25; i2++) {
      var pair = entries[i2] || ["--", "--"];
      var key = pair[0];
      var val = pair[1];
      var cls = classifyValue(val, key);
      var safeKey = escapeHtml(key);
      var safeVal = escapeHtml(val);
      html += '<div class="matrix-item" title="' + safeKey + ": " + safeVal + '">'
            +   '<div class="m-label">' + safeKey + '</div>'
            +   '<div class="m-value ' + cls + '">' + safeVal + '</div>'
            + '</div>';
    }
  }
  $container.html(html);
  try { $container.addClass("flash-update"); } catch(_e) {}
  setTimeout(function() { try { $container.removeClass("flash-update"); } catch(_e) {} }, 400);
}

function jqSel(sel) {
  if (typeof $ !== "undefined") return $(sel);
  var el = document.querySelector(sel);
  return {
    0: el, length: el ? 1 : 0,
    html: function(h) { if (h == null) return el ? el.innerHTML : ""; if (el) el.innerHTML = String(h); return this; },
    text: function(t) { if (t == null) return el ? el.textContent : ""; if (el) el.textContent = String(t); return this; },
    css: function(k, v) { if (el) el.style[k] = v; return this; },
    addClass: function(c) { if (el) el.classList.add(c); return this; },
    removeClass: function(c) { if (el) el.classList.remove(c); return this; }
  };
}

function renderVars(data) {
  jqSel("#m-target-name").text(data.targetName);
  jqSel("#m-val-pleasure").text(_.clamp(data.pleasure, 0, 100) + "%");
  jqSel("#m-val-logic").text(_.clamp(data.logic, 0, 100) + "%");
  jqSel("#m-val-obey").text(_.clamp(data.obey, 0, 100));
  jqSel("#m-target-bar").css("width", _.clamp(data.pleasure, 0, 100) + "%");
  jqSel("#m-logic-bar").css("width", _.clamp(data.logic, 0, 100) + "%");

  var bodyOrder = ["胸","臀","腿","腰","背","口","手","足","脚","腋","皮肤","体温","心率","呼吸","气味","阴部","阴道","子宫","尿道","肛门","敏感度","湿润度","肌肉张力","神经递质","状态"];
  var outfitOrder = ["上装","下装","外套","袜子","鞋子","丝袜","吊袜带","手套","饰品","头饰","内衣","内裤","贴身衣物","胸垫","衬裙","材质","破损度","应力","覆盖率","透光度","附件A","附件B","附件C","特殊A","特殊B"];
  renderMatrix(jqSel("#m-grid-body"), data.body, bodyOrder);
  renderMatrix(jqSel("#m-grid-outfit"), data.outfit, outfitOrder);
}

/* === Step 7: 事件绑定+入口 === */
async function init() {
  try { await waitGlobalInitialized('Mvu'); } catch(_e) {}
  var refresh = function() {
    try { renderVars(loadVars()); } catch(e) { console.warn("[statusbar] refresh err:", e); }
  };
  refresh();
  setTimeout(refresh, 800);
  setTimeout(refresh, 2200);
  try { eventOn(Mvu.events.VARIABLE_INITIALIZED, refresh); } catch(_e) {}
  try { eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, refresh); } catch(_e) {}
}
ready(ec(init));
})();
  </script>
</head>
<body>
<div class="mvu-matrix-ui">
  <!-- 顶部：观测目标核心摘要 -->
  <div class="matrix-card">
    <div class="matrix-title">✧ 观测对象：<span id="m-target-name">载入中...</span></div>
    <div style="font-size:0.6em;color:var(--m-label);margin-bottom:2px">● 实时快感指数</div>
    <div class="m-bar-wrap"><div id="m-target-bar" class="m-bar-fill" style="width:0%"></div></div>
    <div style="font-size:0.6em;color:var(--m-label);margin-bottom:2px">● 逻辑稳定性（位面排斥阈值）</div>
    <div class="m-bar-wrap"><div id="m-logic-bar" class="m-bar-fill logic" style="width:0%"></div></div>
    <div class="summary-row">
      <div class="matrix-item" style="aspect-ratio:auto;padding:6px 4px">
        <div class="m-label">实时快感</div>
        <div class="m-value good" id="m-val-pleasure">0%</div>
      </div>
      <div class="matrix-item" style="aspect-ratio:auto;padding:6px 4px">
        <div class="m-label">逻辑稳定性</div>
        <div class="m-value ok" id="m-val-logic">100%</div>
      </div>
      <div class="matrix-item" style="aspect-ratio:auto;padding:6px 4px">
        <div class="m-label">服从值</div>
        <div class="m-value num" id="m-val-obey">10</div>
      </div>
      <div class="matrix-item" style="aspect-ratio:auto;padding:6px 4px">
        <div class="m-label">观测等级</div>
        <div class="m-value warn">α测试</div>
      </div>
    </div>
  </div>

  <!-- 中部：身体部位 5x5 监测矩阵 -->
  <div class="matrix-card">
    <div class="matrix-title">✧ 身体生理观测矩阵 (5×5)</div>
    <div id="m-grid-body" class="matrix-grid">
      <div class="loading-state">系统扫描中...</div>
    </div>
  </div>

  <!-- 底部：着装服饰 5x5 扫描矩阵 -->
  <div class="matrix-card">
    <div class="matrix-title">✧ 逻辑外壳扫描矩阵 (5×5)</div>
    <div id="m-grid-outfit" class="matrix-grid">
      <div class="loading-state">数据链路建立中...</div>
    </div>
  </div>
</div>
</body>
</html>
